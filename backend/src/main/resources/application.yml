server:
  port: ${PORT:8080}

spring:
  application:
    name: messaging-system

  # File cau hinh rieng cua tung may (KHONG commit len git) - chua mat khau SMTP, DB...
  # Copy application-local.example.yml -> application-local.yml roi dien thong tin.
  # Tim file theo thu muc dang chay backend (backend/ hoac thu muc goc project).
  config:
    import: optional:file:./application-local.yml,optional:file:./backend/application-local.yml

  # ==== PostgreSQL ====
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:messaging_db}?sslmode=${DB_SSL_MODE:disable}
    username: ${DB_USERNAME:messaging_app}
    password: ${DB_PASSWORD:messaging_dev_password}

  sql:
    init:
      mode: never

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  # ==== Gui email (ma xac thuc dang ky) ====
  # Chi can khai bao MAIL_USERNAME + MAIL_PASSWORD (Gmail: dung App Password) la tu dong gui email that.
  # Neu de trong, ma xac thuc chi duoc in ra console cua backend de test.
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 10000
          timeout: 10000
          writetimeout: 10000

  servlet:
    multipart:
      max-file-size: 200MB
      max-request-size: 210MB

app:
  jwt:
    secret: ${JWT_SECRET:CHANGE_THIS_TO_A_LONG_RANDOM_SECRET_KEY_AT_LEAST_256_BITS}
    access-token-expiration-ms: 86400000      # 24 hours
    refresh-token-expiration-ms: 2592000000   # 30 days
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://192.168.*:5173,http://10.*:5173,http://172.16.*:5173,http://172.17.*:5173,http://172.18.*:5173,http://172.19.*:5173,http://172.20.*:5173,http://172.21.*:5173,http://172.22.*:5173,http://172.23.*:5173,http://172.24.*:5173,http://172.25.*:5173,http://172.26.*:5173,http://172.27.*:5173,http://172.28.*:5173,http://172.29.*:5173,http://172.30.*:5173,http://172.31.*:5173}
  mail:
    enabled: ${MAIL_ENABLED:false}
    from: ${MAIL_FROM:}
  auth:
    email-verification:
      code-ttl-minutes: 10
      resend-cooldown-seconds: 60
      max-attempts: 5
      max-sends-per-hour: 5
      verified-token-ttl-minutes: 15
  upload:
    dir: ${UPLOAD_DIR:./uploads}
    max-file-size-mb: 10
    video-max-file-size-mb: ${VIDEO_MAX_FILE_SIZE_MB:200}

logging:
  level:
    com.example.messaging: DEBUG
    org.springframework.security: INFO
