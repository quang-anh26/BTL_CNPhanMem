server:
  port: 8080

spring:
  application:
    name: messaging-system

  # ==== Microsoft SQL Server ====
  datasource:
    url: jdbc:sqlserver://${DB_HOST:localhost}:${DB_PORT:1433};databaseName=${DB_NAME:messaging_db};encrypt=true;trustServerCertificate=true
    username: ${DB_USERNAME:messaging_app}
    password: ${DB_PASSWORD:MatKhauCuaBan2024}
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.SQLServerDialect
        format_sql: true

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

app:
  jwt:
    secret: ${JWT_SECRET:CHANGE_THIS_TO_A_LONG_RANDOM_SECRET_KEY_AT_LEAST_256_BITS}
    access-token-expiration-ms: 86400000      # 24 hours
    refresh-token-expiration-ms: 2592000000   # 30 days
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://192.168.*:5173,http://10.*:5173,http://172.16.*:5173,http://172.17.*:5173,http://172.18.*:5173,http://172.19.*:5173,http://172.20.*:5173,http://172.21.*:5173,http://172.22.*:5173,http://172.23.*:5173,http://172.24.*:5173,http://172.25.*:5173,http://172.26.*:5173,http://172.27.*:5173,http://172.28.*:5173,http://172.29.*:5173,http://172.30.*:5173,http://172.31.*:5173}
  upload:
    dir: ${UPLOAD_DIR:./uploads}
    max-file-size-mb: 10

logging:
  level:
    com.example.messaging: DEBUG
    org.springframework.security: INFO
