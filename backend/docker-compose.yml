# Spin up a local PostgreSQL database for development/testing in one command:
#   docker compose up -d
services:
  postgres:
    image: postgres:16
    container_name: messaging-postgres
    environment:
      POSTGRES_DB: messaging_db
      POSTGRES_USER: messaging_app
      POSTGRES_PASSWORD: messaging_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U messaging_app -d messaging_db"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
